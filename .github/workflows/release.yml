name: Release Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.3)'
        required: true

env:
  NODE_ENV: production

jobs:

  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-check.outputs.version }}
      is_prerelease: ${{ steps.version-check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate version
        id: version-check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate-version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: Build
        env:
          RELEASE_VERSION: ${{ needs['validate-version'].outputs.version }}
        run: |
          echo "Building version: $RELEASE_VERSION"
          npm run build || echo "No build script - skipping"
          mkdir -p dist
          tar -czf "release-${RELEASE_VERSION}.tar.gz" dist/
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs['validate-version'].outputs.version }}
          path: release-*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  sign-artifact:
    name: Sign Release
    runs-on: ubuntu-latest
    needs: [build-release, validate-version]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-${{ needs['validate-version'].outputs.version }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifact (keyless OIDC)
        run: |
          cosign sign-blob release-*.tar.gz \
            --yes \
            --output-signature release-signed.sig
        continue-on-error: true

  publish-github-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [sign-artifact, validate-version]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-${{ needs['validate-version'].outputs.version }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs['validate-version'].outputs.is_prerelease == 'true' }}
          name: 'Release ${{ needs[''validate-version''].outputs.version }}'
          tag_name: ${{ needs['validate-version'].outputs.version }}
          body: |
            ## What Changed
            See CHANGELOG.md for details.
            Version: ${{ needs['validate-version'].outputs.version }}
          files: |
            release-*.tar.gz
          fail_on_unmatched_files: false

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [publish-github-release]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm
      - run: npm install
      - name: Publish
        run: npm publish --access public
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [publish-github-release, publish-npm]
    if: always()
    steps:
      - name: Send release notification
        continue-on-error: true
        timeout-minutes: 5
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Released ${{ needs['validate-version'].outputs.version }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
