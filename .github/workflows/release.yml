name: Release Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  # BUG 38 â push.tags pattern is wrong
  # 'v*.*.*' only matches tags like v1.2.3 but not v1.0.0-rc.1 (pre-releases)
  # More critically, the wildcard ** is needed to match all sub-paths
  # but worse: the event is 'push' but the release job needs 'workflow_dispatch'
  # for manual emergency releases â that trigger is completely missing
  # FIX: add workflow_dispatch, fix tags pattern to v[0-9]*
  push:
    tags:
      - "v*.*.*"

env:
  NODE_ENV: test

jobs:

  # ââ JOB 1: validate-version ââââââââââââââââââââââââââââââââââââââââââââââââââ
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest

    # BUG 39 â outputs declared but steps never set them
    # The step 'version-check' has no id, so outputs can't be captured
    # And the output expression refs a step id that doesn't exist
    # FIX: add id: version-check to the step and set the output in run
    outputs:
      version: ${{ steps.version-check.outputs.version }}
      is_prerelease: ${{ steps.version-check.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate version
        # Missing: id: version-check   â BUG 39
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Version: $VERSION"
          # BUG 40 â outputs are never set; downstream jobs get empty strings
          # FIX: add these lines:
          # echo "version=$VERSION" >> $GITHUB_OUTPUT
          # echo "is_prerelease=$([[ $VERSION == *-* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "Validated: $VERSION"

  # ââ JOB 2: build-release âââââââââââââââââââââââââââââââââââââââââââââââââââââ
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate-version]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Build
        # BUG 41 â references output from validate-version using wrong job id
        # the job is 'validate-version' (hyphen) so needs context key is 'validate-version'
        # but this uses 'validate_version' (underscore) â empty string result
        # FIX: use needs['validate-version'].outputs.version
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          echo "Building version: $RELEASE_VERSION"
          npm run build
          # BUG 42 â tries to tar dist/ which never gets created (build is just echo)
          tar -czf release-$RELEASE_VERSION.tar.gz dist/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          # BUG 43 â artifact name uses the broken output (will be "release-")
          # because RELEASE_VERSION is empty due to BUG 41
          name: release-${{ needs.validate_version.outputs.version }}
          path: release-*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  # ââ JOB 3: sign-artifact âââââââââââââââââââââââââââââââââââââââââââââââââââââ
  sign-artifact:
    name: Sign Release
    runs-on: ubuntu-latest
    needs: [build-release, validate-version]

    # BUG 44 â OIDC permissions missing id-token: write
    # Cosign OIDC signing requires this permission
    # ACTUAL ERROR: "Error: failed to get OIDC token"
    # FIX: add id-token: write to permissions
    permissions:
      contents: read
      packages: write
      # id-token: write  â intentionally removed

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          # BUG 45 â name uses same broken expression as BUG 43
          # artifact "release-" was never successfully uploaded
          # FIX: fix the expression to use needs['validate-version'].outputs.version
          name: release-${{ needs.validate_version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifact
        # BUG 46 â cosign sign-blob expects specific flags and the --key flag
        # without a key file specified â will fail looking for a file that doesn't exist
        # FIX: use keyless signing with --yes flag for non-interactive OIDC
        run: |
          cosign sign-blob release-*.tar.gz \
            --key cosign.key \
            --output-signature release-*.tar.gz.sig

  # ââ JOB 4: publish-github-release ââââââââââââââââââââââââââââââââââââââââââââ
  publish-github-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [sign-artifact, validate-version]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # BUG 47 â is_prerelease output is empty (from BUG 40)
          # so this always evaluates to false string comparison
          # ACTUAL EFFECT: pre-releases are never marked as pre-release on GitHub
          # FIX: fix the output capture in validate-version step
          prerelease: ${{ needs.validate_version.outputs.is_prerelease == 'true' }}
          name: "Release ${{ needs.validate_version.outputs.version }}"
          body: |
            ## What's Changed
            See CHANGELOG.md for details.

            **Version:** ${{ needs.validate_version.outputs.version }}
          files: |
            release-*.tar.gz
            release-*.tar.gz.sig
          # BUG 48 â fail_on_unmatched_files is true but .sig file won't exist
          # because cosign signing failed in BUG 46
          fail_on_unmatched_files: true

  # ââ JOB 5: publish-npm âââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [publish-github-release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # BUG 49 â registry-url is for GitHub Packages, not npm
          # ACTUAL ERROR: "npm ERR! 404 Not Found - PUT https://npm.pkg.github.com/..."
          # FIX: change to https://registry.npmjs.org/
          registry-url: https://npm.pkg.github.com/

      - run: npm install

      - name: Publish
        run: npm publish --access public
        env:
          # BUG 50 â NODE_AUTH_TOKEN should use NPM_TOKEN for npm registry
          # GITHUB_TOKEN only works for GitHub Packages registry
          # FIX: change to secrets.NPM_TOKEN
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ââ JOB 6: notify-release ââââââââââââââââââââââââââââââââââââââââââââââââââââ
  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [publish-github-release, publish-npm]
    if: always()

    steps:
      - name: Send release notification
        continue-on-error: true
        # BUG 51 â step-level timeout-minutes conflicts with job taking longer
        # timeout-minutes: 1 is too short for Slack notification with retries
        # Also the action version doesn't exist
        # FIX: change to a valid version like v1.27.0 and raise timeout
        timeout-minutes: 1
        uses: slackapi/slack-github-action@v1.99.0
        with:
          payload: |
            {
              "text": "ð Released ${{ needs.validate_version.outputs.version }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Released:* ${{ needs.validate_version.outputs.version }}\n*Status:* ${{ needs.publish-github-release.result }}"
                  }
                }
              ]
            }
        env:
          # BUG 52 â SLACK_WEBHOOK_URL secret not defined
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
