name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronized, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

  dependency-review:
    continue-on-error: true
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=my-org_aegis-nightmare
            -Dsonar.organization=my-org
            -Dsonar.sources=src/
            -Dsonar.tests=tests/

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    needs: [codeql, sonarcloud]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: Check licenses
        run: npx license-checker --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0'
        continue-on-error: true
      - name: Save license report
        run: |
          mkdir -p reports/
          npx license-checker --csv --out reports/licenses.csv
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: reports/licenses.csv
          if-no-files-found: warn
          retention-days: 7

  notify-quality:
    continue-on-error: true
    name: Quality Gate Status
    runs-on: ubuntu-latest
    needs: [codeql, dependency-review, sonarcloud, license-check]
    if: always()
    steps:
      - name: Check quality gate
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
        run: |
          if [[ "$CODEQL_RESULT" == "success" ]]; then
            echo "Quality gate passed"
          else
            echo "Quality gate failed"
          fi