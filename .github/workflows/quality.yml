name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    # BUG 22 â types filter is wrong: 'opened' and 'synchronized' are correct
    # but 'reopened' is misspelled and 'ready_for_reviw' is a typo
    # so re-opened PRs and PRs marked ready-for-review never trigger quality checks
    # FIX: fix spelling: 'reopened' and 'ready_for_review'
    types: [opened, synchronized, reopened, ready_for_reviw]

# BUG 23 â concurrency group same as ci-matrix.yml
# This means pushing to main cancels the quality workflow OR the ci workflow
# depending on which runs first â they share the same group key
# FIX: use a different group name e.g. quality-${{ github.ref }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ââ JOB 1: codeql ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    # BUG 24 â permissions missing security-events: write
    # CodeQL MUST have this permission to upload SARIF results
    # ACTUAL ERROR: "Error: Resource not accessible by integration"
    # FIX: add security-events: write
    permissions:
      contents: read
      actions: read
      # security-events is intentionally missing

    steps:
      - uses: actions/checkout@v4
        with:
          # BUG 25 â fetch-depth: 1 is wrong for CodeQL
          # CodeQL needs full history (fetch-depth: 0) for accurate analysis
          # With depth 1, it misses historical context and produces incomplete results
          # FIX: change to fetch-depth: 0
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # BUG 26 â queries path points to non-existent custom query pack
          # ACTUAL ERROR: "Could not find query pack: .github/codeql/custom-queries"
          # FIX: remove the queries line entirely or point to a valid pack
          queries: .github/codeql/custom-queries

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          # BUG 27 â output path doesn't exist and isn't created
          # ACTUAL ERROR: "ENOENT: no such file or directory, open 'results/codeql.sarif'"
          # FIX: remove output line or add a mkdir step before
          output: results/codeql.sarif

  # ââ JOB 2: dependency-review âââââââââââââââââââââââââââââââââââââââââââââââââ
  dependency-review:
    continue-on-error: true
    name: Dependency Review
    runs-on: ubuntu-latest
    # BUG 28 â this job should only run on pull_request events
    # but the if condition uses wrong event name syntax
    # 'github.event_name == pull_request' (missing quotes around value)
    # is a valid expression that evaluates to FALSE always (comparing to object)
    # ACTUAL EFFECT: job is ALWAYS skipped, even on real PRs
    # FIX: github.event_name == 'pull_request' (add quotes)
    if: github.event_name == pull_request

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # BUG 29 â deny-licenses is wrong format; should be a list not a string
          # ACTUAL ERROR: "deny-licenses must be a list"
          # FIX: use YAML list format
          deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0"

  # ââ JOB 3: sonarcloud ââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # BUG 30 â npm install again without lockfile
      - run: npm install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          # BUG 31 â wrong env var name: should be SONAR_TOKEN not SONARCLOUD_TOKEN
          # ACTUAL ERROR: "You must define the SONAR_TOKEN environment variable"
          # FIX: rename to SONAR_TOKEN
          SONARCLOUD_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=my-org_aegis-nightmare
            -Dsonar.organization=my-org
            # BUG 32 â sonar.sources points to wrong directory
            # ACTUAL ERROR: "No files nor directories matching 'source/'"
            # FIX: change to src/
            -Dsonar.sources=source/
            -Dsonar.tests=tests/

  # ââ JOB 4: license-check âââââââââââââââââââââââââââââââââââââââââââââââââââââ
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    # BUG 33 â needs references sonar-cloud (hyphen) but job id is sonarcloud (no hyphen)
    # ACTUAL ERROR: "Job 'sonar-cloud' referenced but not defined"
    # FIX: change to sonarcloud
    needs: [codeql, sonar-cloud]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Check licenses
        # BUG 34 â license-checker not in package.json â not installed
        # ACTUAL ERROR: "sh: 1: license-checker: not found"
        # FIX: add npx or install license-checker first
        run: license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0"

      - name: Save license report
        run: |
          # BUG 35 â mkdir missing; reports/ doesn't exist
          # ACTUAL ERROR: "license-checker: cannot write to reports/licenses.csv: No such file or directory"
          # FIX: add mkdir -p reports/ before the license-checker command
          npx license-checker --csv --out reports/licenses.csv

      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: reports/licenses.csv
          if-no-files-found: warn
          retention-days: 7

  # ââ JOB 5: notify-quality ââââââââââââââââââââââââââââââââââââââââââââââââââââ
  notify-quality:
    continue-on-error: true
    name: Quality Gate Status
    runs-on: ubuntu-latest
    needs: [codeql, dependency-review, sonarcloud, license-check]
    if: always()

    steps:
      - name: Check quality gate
        # BUG 36 â needs context used with wrong result values
        # GitHub result values are: success, failure, cancelled, skipped
        # 'passed' and 'failed' are NOT valid result values
        # ACTUAL EFFECT: condition always evaluates to false â wrong status reported
        # FIX: use 'success' and 'failure'
        run: |
          if [[ "${{ needs.codeql.result }}" == "passed" ]]; then
            echo "â CodeQL passed"
          else
            echo "â CodeQL failed: ${{ needs.codeql.result }}"
          fi
          if [[ "${{ needs.sonarcloud.result }}" == "passed" ]]; then
            echo "â SonarCloud passed"
          else
            echo "â SonarCloud: ${{ needs.sonarcloud.result }}"
          fi

      - name: Post PR comment
        # BUG 37 â uses wrong github token context
        # secrets.GITHUB_TOKEN is NOT the right way to use the built-in token in run steps
        # For gh CLI, use ${{ github.token }} or GITHUB_TOKEN env var directly
        # FIX: set env: GH_TOKEN: ${{ github.token }}
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Quality gate: ${{ job.status }}" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
