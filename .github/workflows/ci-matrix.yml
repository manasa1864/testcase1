name: CI Matrix

on:
  workflow_call:
    secrets:
      inherit
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref || github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_VERSION: ${{ github.sha }}
  CI: 'true'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    outputs:
      lint_passed: ${{ steps.lint-check.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: Run lint
        id: lint-check
        run: npm run lint
        continue-on-error: true

  unit-test:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - name: Run unit tests
        run: npm test
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: Wait for Postgres
        run: until pg_isready -h 127.0.0.1 -p 5432 -U testuser; do sleep 1; done
      - name: Apply schema
        env:
          PGPASSWORD: testpass
        run: |
          if [ -f db/schema.sql ]; then
            psql -h 127.0.0.1 -U testuser -d testdb -f db/schema.sql
          fi
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/testdb
        run: npm run test:integration
        continue-on-error: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-20
          path: ./downloaded-results/
      - name: Generate coverage
        run: npm test -- --coverage
        continue-on-error: true
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [unit-test, coverage, integration-test]
    if: always()
    steps:
      - name: Report
        env:
          UNIT_RESULT: ${{ needs['unit-test'].result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          INTEGRATION_RESULT: ${{ needs['integration-test'].result }}
        run: |
          echo "Unit tests: $UNIT_RESULT"
          echo "Coverage: $COVERAGE_RESULT"
          echo "Integration: $INTEGRATION_RESULT"
