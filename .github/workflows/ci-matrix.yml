name: CI Matrix

on:
  workflow_call:
    secrets:
      inherit
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
# BUG 1 â concurrency group uses wrong ref expression
# github.ref gives "refs/heads/main" but this key collides across all PRs
# because it's not scoped per-PR, so PRs cancel each other's CI mid-run
# FIX: use github.ref || github.head_ref and scope per workflow
# ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # BUG 2 â APP_VERSION uses wrong github context expression
  # github.sha is correct but surrounded by wrong quotes â fails interpolation
  # FIX: remove the surrounding single quotes inside the expression
  APP_VERSION: "${{ 'github.sha' }}"
  CI: 'true'

jobs:

  # ââ JOB 1: lint ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  lint:
    name: Lint
    runs-on: ubuntu-latest

    # BUG 3 â permissions too restrictive; blocks checkout on private repos
    # and blocks any status checks write
    # FIX: add contents: read and statuses: write
    permissions:
      actions: none
      contents: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # BUG 4 â cache uses 'yarn' but project uses npm, no yarn.lock exists
          # ACTUAL ERROR: "Cache not found for key: yarn-..."
          # FIX: change to 'npm'
          cache: yarn

      - run: npm install
      - run: npm run lint

      # BUG 5 â output defined but key name has a typo (will be referenced wrongly)
      # The downstream job references 'lint_passed' but this outputs 'lint-passed'
      # FIX: change to lint_passed (underscores) to match downstream reference
    outputs:
      lint-passed: ${{ steps.lint-check.outputs.result }}

  # ââ JOB 2: unit-test âââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  unit-test:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      # BUG 6 â fail-fast is true (default), so if Node 18 fails,
      # Node 20 is cancelled before it runs â loses matrix coverage data
      # FIX: fail-fast: false
      fail-fast: true
      matrix:
        node: ["16", "18", "20"]
        # BUG 7 â exclude tries to exclude node 16 but uses wrong key name
        # 'version' should be 'node' to match the matrix key above
        # FIX: change 'version: "16"' to 'node: "16"'
        exclude:
          - version: "16"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # BUG 8 â cache-dependency-path points to non-existent file
          # ACTUAL ERROR: "Some specified paths were not resolved..."
          # FIX: remove cache-dependency-path or point to package-lock.json

      # BUG 9 â npm install fails: no package-lock.json in repo
      # ACTUAL ERROR: "npm ERR! code ENOENT ... package-lock.json"
      # FIX: change to npm install
      - run: npm install

      - name: Run unit tests
        run: npm test

      # BUG 10 â artifact upload name includes matrix variable with wrong syntax
      # ${{ matrix.node-version }} should be ${{ matrix.node }}
      # 'node-version' is not a matrix key â outputs empty string
      # ACTUAL EFFECT: all 3 matrix runs upload artifact with same name "" â overwrite
      # FIX: change matrix.node-version to matrix.node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results/
          # BUG 11 â retention-days value is a string not a number
          # FIX: change "7" to 7 (remove quotes)
          retention-days: "7"

  # ââ JOB 3: integration-test ââââââââââââââââââââââââââââââââââââââââââââââââââ
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test]

    # Service container for postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          # BUG 12 â wrong env var name: POSTGRES_NAME should be POSTGRES_DB
          # ACTUAL ERROR: postgres starts but with default "testuser" db, not "testdb"
          # causing connection to fail
          # FIX: rename to POSTGRES_DB
          POSTGRES_NAME: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          # BUG 13 â health retries is 3, too low for cold-start postgres
          # often times out before postgres is ready
          # FIX: change to --health-retries 10
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Wait for Postgres
        run: |
          # BUG 14 â wrong postgres host: should be 127.0.0.1 (localhost), not 'postgres'
          # 'postgres' is the service name, only valid inside Docker network
          # but this step runs on the runner host, not inside a container
          # ACTUAL ERROR: "ECONNREFUSED postgres:5432"
          # FIX: change to 127.0.0.1
          until pg_isready -h postgres -p 5432 -U testuser; do sleep 1; done

      - name: Apply schema
        # BUG 15 â DATABASE_URL uses wrong host (postgres instead of localhost)
        # and wrong db name (testdb vs what postgres actually created as POSTGRES_NAME)
        # FIX: use 127.0.0.1 and match the db name to the fixed POSTGRES_DB value
        env:
          PGPASSWORD: testpass
        run: psql -h postgres -U testuser -d testdb -f db/schema.sql

      - name: Run integration tests
        # BUG 16 â DATABASE_URL uses 'postgres' hostname (wrong, see BUG 14)
        # and references wrong db name matching the broken POSTGRES_NAME from BUG 12
        env:
          DATABASE_URL: postgresql://testuser:testpass@postgres:5432/testdb
        run: npm run test:integration

  # ââ JOB 4: coverage ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      # BUG 17 â downloads artifact using wrong name that was never uploaded
      # because of BUG 10 (matrix.node-version was empty string)
      # ACTUAL ERROR: "No artifact found for name: test-results-20"
      # FIX: fix artifact name to match BUG 10 fix
      - uses: actions/download-artifact@v4
        with:
          name: test-results-20
          path: ./downloaded-results/

      - name: Generate coverage
        # BUG 18 â c8 not in package.json â not installed
        # ACTUAL ERROR: "sh: 1: c8: not found"
        run: npx c8 --reporter=lcov node tests/unit.js

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          # BUG 19 â CODECOV_TOKEN secret not defined
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ââ JOB 5: build-summary âââââââââââââââââââââââââââââââââââââââââââââââââââââ
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    # BUG 20 â needs references 'integration_test' (underscore) but job id
    # is 'integration-test' (hyphen) â GitHub will reject this as unknown job
    # ACTUAL ERROR: "Job 'integration_test' referenced but not defined"
    # FIX: change to integration-test
    needs: [unit-test, coverage, integration_test]
    if: always()

    steps:
      - name: Report
        # BUG 21 â needs.unit-test.result uses wrong job id format in expression
        # Hyphenated job ids in needs context must use bracket notation or be referenced correctly
        # ${{ needs.unit-test.result }} works but ${{ needs.unit_test.result }} does NOT
        # FIX: use needs['unit-test'].result or keep hyphens consistently
        run: |
          echo "Unit tests: ${{ needs.unit_test.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Integration: ${{ needs.integration_test.result }}"
